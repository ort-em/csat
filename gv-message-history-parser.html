<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Ермоленко В.П.">
  <title>GV Message History Parser</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop stop-color='%23eae619'/%3E%3Cstop offset='.5' stop-color='%2315b648'/%3E%3Cstop offset='1' stop-color='%230a9fdf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpath d='M16 3 22 16 16 29 10 16Z M3 16 16 10 29 16 16 22Z' fill='white'/%3E%3C/svg%3E">
  <style>
    :root {
      --green: #21a038; --green-dark: #0f8a2e; --green-deep: #0b6e24;
      --green-light: #e7f6ea; --green-soft: #f4fbf5;
      --black: #0f0f0f; --text: #1d1d1f; --muted: #6e7278;
      --bg: #f2f3f5; --surface: #fff; --border: #e4e6ea; --border-strong: #d3d6db;
      --font: "Sber Sans", "SB Sans Interface", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button, textarea { font: inherit; }
    button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #78cc87; outline-offset: 2px; }
    .app-header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 12px 32px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand-mark { width: 40px; height: 40px; flex: 0 0 40px; border-radius: 12px; box-shadow: 0 4px 12px #21a03847; }
    .brand-title { margin: 0; color: var(--black); font-size: 19px; line-height: 1.2; }
    .brand-sub { color: var(--muted); font-size: 12.5px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 9px 17px; border: 1px solid transparent; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .btn-primary { background: var(--green); color: #fff; box-shadow: 0 4px 12px #21a0383d; }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-secondary { background: var(--green-light); color: var(--green-deep); }
    .btn-secondary:hover { background: #d6efdc; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-strong); }
    .btn-ghost:hover { background: var(--bg); border-color: var(--green); }
    .app-main { max-width: 1320px; margin: 0 auto; padding: 24px 28px 48px; }
    .content { display: grid; grid-template-columns: minmax(220px, 270px) minmax(0, 1fr); gap: 20px; align-items: start; }
    .sidebar { min-width: 0; position: sticky; top: 96px; }
    .sessions-history, .message-history-session { min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; box-shadow: 0 2px 12px #0f0f0f0f; }
    .sessions-history { padding: 18px 14px; max-height: calc(100vh - 120px); overflow-y: auto; }
    .message-history-session { min-height: 520px; padding: 24px clamp(18px, 3vw, 36px) 32px; }
    .sessions-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; padding: 0 5px; }
    .aside-title { margin: 0; color: var(--black); font-size: 15px; }
    .composer { margin-top: 0; }
    .composer[hidden] { display: none; }
    .composer-card { width: 100%; margin: 0 auto; padding: 16px; border: 1px solid var(--border); border-radius: 18px; background: #f9fbfa; }
    .composer-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 4px 10px; }
    .composer-title { margin: 0; color: var(--black); font-size: 15px; }
    .composer-hint { color: var(--muted); font-size: 12px; }
    .json-editor { display: block; width: 100%; height: 80px; min-height: 80px; max-height: 40vh; padding: 12px 14px; border: 1px solid var(--border); border-radius: 14px; background: #fbfbfc; color: var(--text); font: 12.5px/1.5 var(--mono); resize: vertical; }
    .json-editor:focus { background: #fff; border-color: var(--green); outline: 3px solid #21a03822; }
    .panel-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .status { margin-left: auto; font-size: 12px; font-weight: 600; }
    .status-ok { color: var(--green-dark); }
    .status-error { color: #b3261e; }
    .aside-empty, .empty-state { margin: 0; color: var(--muted); font-size: 13.5px; }
    .empty-state { display: grid; align-content: center; justify-items: center; min-height: 250px; text-align: center; }
    .empty-icon { display: grid; place-items: center; width: 58px; height: 58px; margin-bottom: 16px; border-radius: 18px; background: var(--green-light); color: var(--green-deep); font-size: 25px; }
    .empty-title { margin: 0 0 5px; color: var(--black); font-size: 19px; font-weight: 700; }
    .session-list { display: flex; flex-direction: column; gap: 6px; }
    .new-session-btn { width: 100%; margin-bottom: 12px; padding: 9px 12px; border: 1px solid #ccebd4; border-radius: 10px; background: var(--green-light); color: var(--green-deep); font-size: 12px; font-weight: 700; text-align: left; cursor: pointer; }
    .new-session-btn:hover { background: #d9f1df; }
    .session-item { display: flex; gap: 4px; }
    .session-item-main { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: #fbfbfc; color: var(--text); text-align: left; cursor: pointer; }
    .session-item-main:hover, .session-item-active .session-item-main { border-color: var(--green); background: var(--green-soft); }
    .session-item-id { overflow: hidden; font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-meta { overflow: hidden; color: var(--muted); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .session-item-del, .session-clear-btn { width: 28px; min-width: 28px; border: 1px solid var(--border-strong); border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    .session-item-del:hover, .session-clear-btn:hover { border-color: #f6d3d1; background: #fdecec; color: #b3261e; }
    .session-clear-btn { height: 28px; }
    .session-hero { padding-bottom: 18px; border-bottom: 1px solid var(--border); }
    .hero-eyebrow { margin: 0 0 4px; color: var(--green-deep); font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    .info-title { margin: 0 0 10px; font-size: clamp(19px, 2vw, 24px); overflow-wrap: anywhere; }
    .meta-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .meta-chip { padding: 5px 9px; border-radius: 99px; background: #f1f3f4; color: #4c535a; font-size: 11px; }
    .meta-tip { position: relative; }
    .meta-tip summary { list-style: none; cursor: pointer; }
    .meta-tip summary::-webkit-details-marker { display: none; }
    .meta-tip[open] summary { color: var(--green-deep); }
    .meta-tip pre { position: absolute; z-index: 4; top: calc(100% + 7px); left: 0; width: max-content; max-width: min(360px, calc(100vw - 70px)); max-height: 260px; overflow: auto; margin: 0; padding: 11px 13px; border: 1px solid var(--border-strong); border-radius: 10px; background: #fff; box-shadow: 0 8px 24px #0f0f0f1c; font: 11px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta-tip-ranker pre { right: 0; left: auto; }
    .time-range { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 10px; }
    .info-meta { margin: 4px 0; font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .session-extras { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 22px; }
    .info-block { margin: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: #f8f9fa; color: #525b62; font-size: 12px; }
    .info-block[open] { flex-basis: 100%; }
    .info-block summary { font-weight: 600; cursor: pointer; }
    .info-block pre { overflow-x: auto; margin-bottom: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.5 var(--mono); }
    .section-title { margin: 0 0 16px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .warnings { margin-top: 16px; padding: 10px 14px; border-radius: 10px; background: #fff7e8; color: #815c15; font-size: 13px; }
    .warnings ul { margin: 6px 0 0; padding-left: 20px; }
    .dialog { display: flex; flex-direction: column; gap: 11px; }
    .message-row { display: flex; align-items: flex-end; gap: 8px; }
    .message-row-user { justify-content: flex-end; }
    .message-row-assistant { justify-content: flex-start; }
    .message-avatar { display: grid; place-items: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 10px; background: linear-gradient(135deg, #24ae4c, #039bba); color: #fff; font-size: 13px; font-weight: 800; }
    .message-bubble { max-width: min(78%, 650px); min-width: 0; padding: 10px 14px; border: 1px solid var(--border); border-radius: 16px; background: #f7f8fa; box-shadow: 0 1px 2px #0f0f0f08; }
    .message-row-user .message-bubble { border-color: #ccebd4; border-bottom-right-radius: 5px; background: var(--green-light); color: #123b1e; }
    .message-row-assistant .message-bubble { border-bottom-left-radius: 5px; }
    .message-label { margin-bottom: 3px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .message-row-user .message-label { color: var(--green-deep); }
    .message-text { margin: 0; font-size: 14px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .activity-row { display: flex; justify-content: flex-start; margin: 2px 0; padding-left: 36px; }
    .activity-pill, .activity-detail { max-width: 88%; min-width: 0; border: 1px solid var(--border); border-radius: 12px; background: #f8f9fa; color: #5b6268; font-size: 12px; }
    .activity-pill { padding: 5px 11px; text-align: left; }
    .activity-detail { width: min(78%, 540px); padding: 7px 11px; }
    .activity-detail summary { cursor: pointer; font-weight: 600; overflow-wrap: anywhere; }
    .activity-detail pre { margin: 8px 0 2px; padding: 8px; border-radius: 8px; background: #fff; font: 11px/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
    .activity-call { border-color: #d9dff8; background: #f4f5ff; }
    .activity-result { border-color: #cfe7f7; background: #f0f8fd; }
    .activity-error { border-color: #f6d3d1; background: #fff1f0; color: #8c1d18; }
    .load-more-btn { display: block; margin: 18px auto 0; padding: 8px 15px; border: 1px solid var(--border-strong); border-radius: 10px; background: #fff; color: var(--green-deep); font-size: 12px; font-weight: 700; cursor: pointer; }
    .load-more-btn:hover { background: var(--green-light); }
    .load-more-btn[hidden] { display: none; }
    .json-key { color: #7d3bb8; } .json-string { color: #116b42; } .json-number { color: #bd5a12; } .json-literal { color: #2258b5; }
    @media (max-width: 700px) { .app-header { padding: 12px 16px; } .brand-title { font-size: 16px; } .brand-sub { display: none; } .app-main { padding: 14px 12px 32px; } .content { grid-template-columns: 1fr; gap: 12px; } .sidebar { position: static; } .sessions-history { max-height: 150px; padding: 12px; } .message-history-session { min-height: 55vh; padding: 20px 15px; } .message-bubble { max-width: 88%; } .composer-card { padding: 12px; } .composer-hint { display: none; } .activity-detail { width: min(88%, 540px); } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <img class="brand-mark" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g'%3E%3Cstop stop-color='%23eae619'/%3E%3Cstop offset='.5' stop-color='%2315b648'/%3E%3Cstop offset='1' stop-color='%230a9fdf'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='7' fill='url(%23g)'/%3E%3Cpath d='M16 3 22 16 16 29 10 16Z M3 16 16 10 29 16 16 22Z' fill='white'/%3E%3C/svg%3E" alt="">
      <div><h1 class="brand-title">GV Message History Parser</h1><span class="brand-sub">Разбор истории сообщений GigaVoice</span></div>
    </div>
    <button class="btn btn-ghost" id="refresh-content-btn" type="button" title="Открыть поле для нового лога">＋ Новый лог</button>
  </header>
  <main class="app-main">
    <div class="content">
      <aside class="sidebar">
        <section id="sessionshistory" class="sessions-history" aria-label="История сессий"></section>
      </aside>
      <section id="message-history-session" class="message-history-session" aria-label="Разбор лога">
        <div id="message-history-content"></div>
        <section id="composer" class="composer" aria-label="Добавить лог Kibana">
          <div class="composer-card">
            <div class="composer-heading"><h2 class="composer-title">Новый лог Kibana</h2><span class="composer-hint">Исходный JSON не сохраняется</span></div>
            <textarea id="correction-input" class="json-editor" spellcheck="false" aria-label="JSON лога Kibana" placeholder="Вставьте JSON лога сюда или загрузите файл…"></textarea>
            <div class="panel-actions">
              <input type="file" id="correction-file" accept=".json,application/json" hidden>
              <button class="btn btn-secondary" id="load-correction-btn" type="button">Загрузить файл</button>
              <button class="btn btn-primary" id="apply-correction-btn" type="button">Обработать ↗</button>
              <span class="status" id="correction-status" role="status" aria-live="polite"></span>
            </div>
          </div>
        </section>
      </section>
    </div>
  </main>
  <script>
    'use strict';
    const STORAGE_KEY = 'gvparsersessions';
    const DB_NAME = 'gv-parser-history';
    const MAX_SESSIONS = 50;
    const DIALOG_PAGE_SIZE = 100;
    const HIGHLIGHT_LIMIT = 10000;
    const FALLBACK_INPUT_LIMIT = 1000000;
    const msghistory = document.getElementById('message-history-content');
    const sessionshistory = document.getElementById('sessionshistory');
    const correctioninput = document.getElementById('correction-input');
    const correctionfile = document.getElementById('correction-file');
    const correctionstatus = document.getElementById('correction-status');
    const composer = document.getElementById('composer');
    let parsedsession = null;
    let activeSessionUid = null;
    let sessions = [];
    let database = null;
    let fallbackData = null;
    let viewVersion = 0;
    let historyReady;

    function el(tag, className, value) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (value !== undefined && value !== null) node.textContent = String(value);
      return node;
    }
    function setStatus(text, type = '') {
      correctionstatus.textContent = text;
      correctionstatus.className = 'status' + (type ? ' status-' + type : '');
    }
    function compactSession(source) {
      // Явный список полей не даёт сохранить исходный hit или другие случайные данные.
      const fields = ['sessionid', 'startdate', 'enddate', 'timeinseconds', 'gigamodel',
        'modelsettings', 'rankersettings', 'systemprompt', 'functions', 'fisrtreplica', 'context'];
      const parsed = {};
      for (const field of fields) parsed[field] = source[field] ?? '';
      parsed.dialog = Array.isArray(source.dialog)
        ? source.dialog.map(item => ({
          type: item.type,
          content: item.type === 'error' && typeof item.content !== 'string'
            ? 'Не удалось разобрать элемент лога' : item.content
        })) : [];
      parsed.warnings = Array.isArray(source.warnings) ? source.warnings : [];
      return parsed;
    }
    function openDatabase() {
      return new Promise((resolve, reject) => {
        if (!globalThis.indexedDB) { reject(new Error('IndexedDB недоступна')); return; }
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = () => {
          const db = request.result;
          db.createObjectStore('meta', { keyPath: 'uid' });
          db.createObjectStore('data', { keyPath: 'uid' });
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    function dbWrite(operation) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction(['meta', 'data'], 'readwrite');
        operation(transaction.objectStore('meta'), transaction.objectStore('data'));
        transaction.oncomplete = () => resolve();
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error || new Error('Транзакция отменена'));
      });
    }
    function dbRead(storeName, key) {
      return new Promise((resolve, reject) => {
        const store = database.transaction(storeName, 'readonly').objectStore(storeName);
        const request = key === undefined ? store.getAll() : store.get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    function makeSummary(uid, parsed, savedat = Date.now()) {
      return { uid, savedat, sessionid: parsed.sessionid || '(без ID)',
        startdate: parsed.startdate || '', gigamodel: parsed.gigamodel || '' };
    }
    function loadLegacy() {
      try {
        const entries = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(entries) ? entries.filter(item => item && item.uid && item.parsed).slice(0, MAX_SESSIONS) : [];
      } catch (error) {
        console.warn('Не удалось прочитать старую историю:', error);
        return [];
      }
    }
    async function initializeHistory() {
      try {
        database = await openDatabase();
        const legacy = loadLegacy();
        for (let i = legacy.length - 1; i >= 0; i--) {
          const item = legacy[i];
          const parsed = compactSession(item.parsed);
          const meta = makeSummary(item.uid, parsed, Date.now() - i);
          await dbWrite((metaStore, dataStore) => {
            metaStore.put(meta);
            dataStore.put({ uid: item.uid, parsed });
          });
        }
        if (legacy.length) {
          try { localStorage.removeItem(STORAGE_KEY); }
          catch (error) { console.warn('Старая копия истории не удалена:', error); }
        }
        sessions = (await dbRead('meta')).sort((a, b) => b.savedat - a.savedat);
        while (sessions.length > MAX_SESSIONS) {
          const old = sessions.pop();
          await dbWrite((metaStore, dataStore) => { metaStore.delete(old.uid); dataStore.delete(old.uid); });
        }
      } catch (error) {
        console.warn('IndexedDB недоступна; используется ограниченная история:', error);
        database = null;
        fallbackData = new Map();
        const legacy = loadLegacy().slice(0, 5);
        sessions = legacy.map((item, i) => {
          const parsed = compactSession(item.parsed);
          fallbackData.set(item.uid, parsed);
          return makeSummary(item.uid, parsed, Date.now() - i);
        });
      }
      renderSessionsList();
    }
    async function storeSession(meta, parsed, inputSize) {
      if (database) {
        await dbWrite((metaStore, dataStore) => {
          metaStore.put(meta);
          dataStore.put({ uid: meta.uid, parsed });
        });
        return true;
      }
      if (inputSize > FALLBACK_INPUT_LIMIT) return false;
      fallbackData.set(meta.uid, parsed);
      try {
        const values = sessions.slice(0, 5).map(item => ({ uid: item.uid, parsed: fallbackData.get(item.uid) }));
        localStorage.setItem(STORAGE_KEY, JSON.stringify(values));
        return true;
      } catch (error) {
        console.warn('История не сохранена:', error);
        return false;
      }
    }
    async function readSession(uid) {
      if (!database) return fallbackData.get(uid) || null;
      const entry = await dbRead('data', uid);
      return entry ? entry.parsed : null;
    }
    async function removeSession(uid) {
      if (database) await dbWrite((metaStore, dataStore) => { metaStore.delete(uid); dataStore.delete(uid); });
      else {
        fallbackData.delete(uid);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions.map(item => ({ uid: item.uid, parsed: fallbackData.get(item.uid) })).filter(item => item.parsed))); }
        catch (error) { console.warn('Не удалось обновить историю:', error); }
      }
    }
    async function addSessionToHistory(parsed, activate = true, inputSize = 0) {
      const uid = 's' + Date.now() + Math.random().toString(36).slice(2, 8);
      const meta = makeSummary(uid, parsed);
      sessions.unshift(meta);
      if (activate) activeSessionUid = uid;
      renderSessionsList();
      let saved = false;
      try { saved = await storeSession(meta, parsed, inputSize); }
      catch (error) { console.warn('Не удалось сохранить сессию:', error); }
      while (sessions.length > (database ? MAX_SESSIONS : 5)) {
        const old = sessions.pop();
        try { await removeSession(old.uid); } catch (error) { console.warn('Не удалось удалить старую сессию:', error); }
      }
      if (!saved) {
        fallbackData?.delete(uid);
        sessions = sessions.filter(item => item.uid !== uid);
        renderSessionsList();
      }
      return saved;
    }
    async function selectSession(uid) {
      const version = ++viewVersion;
      try {
        const parsed = await readSession(uid);
        if (version !== viewVersion) return;
        if (!parsed) throw new Error('Запись не найдена');
        parsedsession = parsed;
        activeSessionUid = uid;
        renderSession();
        renderSessionsList();
      } catch (error) { setStatus('Не удалось открыть сессию: ' + error.message, 'error'); }
    }
    async function deleteSession(uid) {
      if (activeSessionUid === uid) newSession();
      sessions = sessions.filter(item => item.uid !== uid);
      renderSessionsList();
      try { await removeSession(uid); } catch (error) { console.warn('Не удалось удалить сессию:', error); }
    }
    async function clearHistory() {
      if (!sessions.length || !confirm('Удалить всю историю сессий?')) return;
      ++viewVersion;
      sessions = [];
      parsedsession = null;
      activeSessionUid = null;
      renderSession();
      renderSessionsList();
      try {
        if (database) await dbWrite((metaStore, dataStore) => { metaStore.clear(); dataStore.clear(); });
        else { fallbackData.clear(); localStorage.removeItem(STORAGE_KEY); }
      } catch (error) { console.warn('Не удалось очистить историю:', error); }
    }
    function newSession() {
      ++viewVersion;
      parsedsession = null;
      activeSessionUid = null;
      correctioninput.value = '';
      setStatus('');
      renderSession();
      renderSessionsList();
      correctioninput.focus?.();
    }
    function renderSessionsList() {
      sessionshistory.replaceChildren();
      const head = el('div', 'sessions-head');
      head.appendChild(el('h3', 'aside-title', 'История сессий'));
      if (sessions.length) {
        const clear = el('button', 'session-clear-btn', '✕');
        clear.type = 'button';
        clear.title = clear.ariaLabel = 'Очистить всю историю';
        clear.addEventListener('click', clearHistory);
        head.appendChild(clear);
      }
      sessionshistory.appendChild(head);
      const newButton = el('button', 'new-session-btn', '＋ Новая сессия');
      newButton.type = 'button';
      newButton.addEventListener('click', newSession);
      sessionshistory.appendChild(newButton);
      if (!sessions.length) {
        sessionshistory.appendChild(el('p', 'aside-empty', 'Сессии не загружены'));
        return;
      }
      const list = el('div', 'session-list');
      for (const item of sessions) {
        const summary = item;
        const row = el('div', 'session-item' + (item.uid === activeSessionUid ? ' session-item-active' : ''));
        const button = el('button', 'session-item-main');
        button.type = 'button';
        button.title = summary.sessionid || '(без ID)';
        button.appendChild(el('div', 'session-item-id', summary.sessionid || '(без ID)'));
        const meta = [formatShortDate(summary.startdate), summary.gigamodel].filter(Boolean).join(' · ');
        button.appendChild(el('div', 'session-item-meta', meta || '—'));
        button.addEventListener('click', () => selectSession(item.uid));
        const del = el('button', 'session-item-del', '✕');
        del.type = 'button';
        del.title = del.ariaLabel = 'Удалить сессию';
        del.addEventListener('click', () => deleteSession(item.uid));
        row.append(button, del);
        list.appendChild(row);
      }
      sessionshistory.appendChild(list);
    }
    function formatShortDate(iso) {
      if (!iso || Number.isNaN(Date.parse(iso))) return '';
      return new Intl.DateTimeFormat('ru-RU', { timeZone: 'Europe/Moscow', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
    }
    function formatDateTime(iso) {
      if (!iso || Number.isNaN(Date.parse(iso))) return '—';
      const date = new Date(iso);
      const formatted = new Intl.DateTimeFormat('ru-RU', {
        timeZone: 'Europe/Moscow', day: 'numeric', month: 'long', year: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(date);
      return `${formatted}.${String(date.getUTCMilliseconds()).padStart(3, '0')} (UTC+03:00)`;
    }
    function formatDuration(totalSeconds) {
      if (!Number.isFinite(totalSeconds) || totalSeconds < 0) return '—';
      const seconds = Math.floor(totalSeconds);
      const parts = [];
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      if (hours) parts.push(`${hours} ч`);
      if (minutes) parts.push(`${minutes} мин`);
      parts.push(`${seconds % 60} сек`);
      return parts.join(' ');
    }
    function safe(fn, fallback = undefined) {
      try { const value = fn(); return value == null ? fallback : value; }
      catch (_) { return fallback; }
    }
    function firstField(fields, key) {
      const value = safe(() => fields[key]);
      return Array.isArray(value) ? value[0] : value;
    }
    function getTs(hit) {
      const raw = firstField(hit && hit.fields, '@timestamp');
      if (typeof raw !== 'string') return null;
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? null : date;
    }
    function getText(content) {
      if (content == null) return '';
      if (typeof content === 'string') return content;
      if (Array.isArray(content)) return content.map(getText).filter(Boolean).join('\n');
      if (typeof content === 'object' && typeof content.text === 'string') return content.text;
      return JSON.stringify(content);
    }
    function parseField(fields, keys) {
      for (const key of keys) {
        const value = firstField(fields, key);
        if (value == null) continue;
        if (typeof value === 'object') return value;
        if (typeof value === 'string') {
          try { return JSON.parse(value); } catch (_) { return null; }
        }
      }
      return null;
    }
    function kibanaparser(raw) {
      const input = JSON.parse(raw);
      const hitsraw = safe(() => input.rawResponse.hits.hits);
      if (!Array.isArray(hitsraw) || hitsraw.length === 0) throw new Error('В данных нет массива rawResponse.hits.hits или он пуст');
      // Сортируем исходный временный массив без копии и считаем время каждого hit один раз.
      const timestamp = Symbol('timestamp');
      let sorted = true;
      let previous = -Infinity;
      for (const hit of hitsraw) {
        const time = getTs(hit);
        hit[timestamp] = time ? time.getTime() : Infinity;
        if (hit[timestamp] < previous) sorted = false;
        previous = hit[timestamp];
      }
      const hits = hitsraw;
      if (!sorted) hits.sort((a, b) => {
        const at = a[timestamp], bt = b[timestamp];
        return at === bt ? 0 : at === Infinity ? 1 : bt === Infinity ? -1 : at - bt;
      });
      const firstIndex = hits.findIndex(hit => firstField(hit.fields, 'msg') === 'Got request');
      if (firstIndex < 0) throw new Error('Не найден первый запрос (msg = "Got request")');
      const firstHit = hits[firstIndex];
      const firstReq = parseField(firstHit.fields, ['request-v2.string', 'request.string']);
      if (!firstReq || typeof firstReq !== 'object') throw new Error('Не удалось разобрать тело первого запроса');
      const warnings = [];
      const start = getTs(firstHit);
      const end = getTs(hits[hits.length - 1]);
      if (!start) warnings.push('Не удалось определить время начала');
      if (!end) warnings.push('Не удалось определить время окончания');
      const messages = Array.isArray(firstReq.messages) ? firstReq.messages : [];
      const session = {
        sessionid: firstField(firstHit.fields, 'session-id') || '(без ID)',
        startdate: start ? start.toISOString() : '',
        enddate: end ? end.toISOString() : '',
        timeinseconds: start && end ? (end - start) / 1000 : null,
        gigamodel: firstReq.model || '',
        modelsettings: firstReq.model_options || '',
        rankersettings: firstReq.ranker_options || '',
        systemprompt: messages[0] ? getText(messages[0].content) : '',
        functions: safe(() => firstReq.tools.functions.specifications) || firstReq.functions || '',
        fisrtreplica: messages[1] ? getText(messages[1].content) : '',
        context: '', dialog: [], warnings
      };
      if (session.sessionid === '(без ID)') warnings.push('В данных нет session-id');
      if (!messages[0]) warnings.push('В первом запросе нет системного промпта');
      if (!messages[1]) warnings.push('В первом запросе нет первой реплики');
      const context = {};
      for (let i = 2; i < messages.length - 1; i += 2) {
        const message = messages[i], next = messages[i + 1];
        const call = safe(() => message.function_call) || safe(() => message.functioncall)
          || safe(() => message.content[0].function_call) || safe(() => message.content[0].functioncall);
        if (call && call.name && next) {
          context[call.name] = safe(() => next.content[0].function_result.result, next.content);
        }
      }
      if (Object.keys(context).length) session.context = context;
      let missingMsgCount = 0;
      for (let i = 0; i < hits.length; i++) {
        if (i === firstIndex) continue;
        const hit = hits[i];
        const msg = firstField(hit.fields, 'msg');
        if (!msg) { missingMsgCount++; continue; }
        if (msg.includes('Got ranked functions')) {
          session.dialog.push({ type: 'ranker', content: msg });
        } else if (msg === 'Stream response') {
          const response = parseField(hit.fields, ['response-v2.string', 'response.string']);
          if (!response) { session.dialog.push({ type: 'error', content: 'Не удалось разобрать Stream response' }); continue; }
          const choice = safe(() => response.choices[0].message);
          const inner = safe(() => response.messages[0]);
          const message = choice || inner;
          if (!message || message.role !== 'assistant') { session.dialog.push({ type: 'error', content: 'Неизвестный формат Stream response' }); continue; }
          const body = Array.isArray(message.content) ? message.content[0] : message.content;
          const call = message.function_call || message.functioncall || safe(() => body.function_call) || safe(() => body.functioncall);
          if (call) session.dialog.push({ type: 'functioncall', content: call });
          else if (body != null) session.dialog.push({ type: 'generation', content: getText(body) });
          else session.dialog.push({ type: 'error', content: 'Пустой Stream response' });
        } else if (msg === 'Got request') {
          const request = parseField(hit.fields, ['request-v2.string', 'request.string']);
          const messages = safe(() => request.messages);
          const message = Array.isArray(messages) ? messages[messages.length - 1] : null;
          if (!message) { session.dialog.push({ type: 'error', content: 'Не удалось разобрать Got request' }); continue; }
          if (message.role === 'user') session.dialog.push({ type: 'user', content: getText(message.content) });
          else if (message.role === 'tool' || message.role === 'function') {
            const result = safe(() => message.content[0].function_result) || message.content;
            session.dialog.push({ type: 'result', content: { name: message.name || safe(() => result.name) || '', result: safe(() => result.result, result) } });
          } else session.dialog.push({ type: 'error', content: `Неизвестная роль: ${String(message.role || '—')}` });
        }
      }
      if (missingMsgCount) warnings.push(`Пропущено hit без msg: ${missingMsgCount}`);
      return session;
    }
    function displayValue(value) {
      if (value == null || value === '') return '—';
      if (typeof value === 'string') {
        try { return JSON.stringify(JSON.parse(value), null, 2); } catch (_) { return value; }
      }
      return JSON.stringify(value, null, 2);
    }
    function appendHighlightedValue(node, value) {
      let json = null;
      if (value !== null && typeof value === 'object') json = JSON.stringify(value, null, 2);
      else if (typeof value === 'string' && /^[\[{]/.test(value.trim())) {
        try { json = JSON.stringify(JSON.parse(value), null, 2); } catch (_) { /* Обычный текст. */ }
      }
      if (json === null) { node.textContent = displayValue(value); return; }
      if (json.length > HIGHLIGHT_LIMIT) { node.textContent = json; return; }
      const tokens = /("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g;
      let cursor = 0;
      for (const match of json.matchAll(tokens)) {
        if (match.index > cursor) node.appendChild(el('span', null, json.slice(cursor, match.index)));
        const color = match[1] ? (match[2] ? 'json-key' : 'json-string') : match[3] ? 'json-number' : 'json-literal';
        node.appendChild(el('span', color, match[0]));
        cursor = match.index + match[0].length;
      }
      if (cursor < json.length) node.appendChild(el('span', null, json.slice(cursor)));
    }
    function details(title, value) {
      const box = el('details', 'info-block');
      box.appendChild(el('summary', null, title));
      fillOnOpen(box, value);
      return box;
    }
    function metaTip(title, value, kind = '') {
      const box = el('details', 'meta-tip ' + kind);
      box.appendChild(el('summary', 'meta-chip', title));
      fillOnOpen(box, value);
      return box;
    }
    function fillOnOpen(box, value) {
      box.addEventListener('toggle', () => {
        if (!box.open || box.dataset.rendered) return;
        const pre = el('pre');
        appendHighlightedValue(pre, value);
        box.appendChild(pre);
        box.dataset.rendered = 'true';
      });
    }
    function messageRow(role, value) {
      const row = el('div', 'message-row message-row-' + role);
      if (role === 'assistant') row.appendChild(el('span', 'message-avatar', '✦'));
      const bubble = el('div', 'message-bubble');
      bubble.appendChild(el('div', 'message-label', role === 'user' ? 'Клиент' : 'GigaVoice'));
      const text = el('p', 'message-text');
      appendHighlightedValue(text, value);
      bubble.appendChild(text);
      row.appendChild(bubble);
      return row;
    }
    function activityRow(title, value, kind = '') {
      const row = el('div', 'activity-row');
      if (value == null) {
        row.appendChild(el('div', 'activity-pill', title));
      } else {
        const box = el('details', 'activity-detail ' + kind);
        box.appendChild(el('summary', null, title));
        fillOnOpen(box, value);
        row.appendChild(box);
      }
      return row;
    }
    function appendDialogMessage(dialog, message) {
      switch (message.type) {
        case 'user': dialog.appendChild(messageRow('user', message.content)); break;
        case 'result': {
          const content = message.content || {};
          const value = content.result == null || content.result === ''
            ? 'Гига не получила результата функции, так как была прервана системой'
            : content.result;
          dialog.appendChild(activityRow(`↳ Результат ${content.name || 'функции'}`, value, 'activity-result'));
          break;
        }
        case 'ranker': dialog.appendChild(activityRow('✧ ' + message.content)); break;
        case 'functioncall': {
          const call = message.content || {};
          dialog.appendChild(activityRow(`⚙ Вызов ${call.name || 'функции'}`, call.arguments || {}, 'activity-call'));
          break;
        }
        case 'generation': dialog.appendChild(messageRow('assistant', message.content)); break;
        default: dialog.appendChild(activityRow('Ошибка в элементе лога', message.content, 'activity-error'));
      }
    }
    function renderSession() {
      msghistory.replaceChildren();
      composer.hidden = !!parsedsession;
      if (!parsedsession) {
        const empty = el('div', 'empty-state');
        empty.appendChild(el('div', 'empty-icon', '✦'));
        empty.appendChild(el('h2', 'empty-title', 'История GigaVoice'));
        empty.appendChild(el('p', null, 'Вставьте лог в поле снизу или выберите сохранённую сессию.'));
        msghistory.appendChild(empty);
        return;
      }
      const session = parsedsession;
      const hero = el('header', 'session-hero');
      hero.appendChild(el('p', 'hero-eyebrow', 'Обработанная сессия'));
      hero.appendChild(el('h2', 'info-title', session.sessionid || '(без ID)'));
      const chips = el('div', 'meta-chips');
      chips.appendChild(el('span', 'meta-chip', session.gigamodel || 'Модель неизвестна'));
      chips.appendChild(el('span', 'meta-chip', formatShortDate(session.startdate) || 'Время неизвестно'));
      chips.appendChild(el('span', 'meta-chip', formatDuration(session.timeinseconds)));
      if (session.modelsettings) chips.appendChild(metaTip('⚙ Настройки модели', session.modelsettings));
      if (session.rankersettings) chips.appendChild(metaTip('⚙ Настройки ранкера', session.rankersettings, 'meta-tip-ranker'));
      hero.appendChild(chips);
      const times = el('div', 'time-range');
      times.appendChild(el('span', 'info-meta', `Начало: ${formatDateTime(session.startdate)}`));
      times.appendChild(el('span', 'info-meta', `Конец: ${formatDateTime(session.enddate)}`));
      hero.appendChild(times);
      msghistory.appendChild(hero);
      const extras = el('div', 'session-extras');
      if (session.systemprompt) extras.appendChild(details('Системный промпт', session.systemprompt));
      if (session.functions && (Array.isArray(session.functions) ? session.functions.length : true)) {
        const count = Array.isArray(session.functions) ? ` (${session.functions.length})` : '';
        extras.appendChild(details('Доступные функции' + count, session.functions));
      }
      if (session.context && Object.keys(session.context).length) extras.appendChild(details('Стартовый контекст', session.context));
      msghistory.appendChild(extras);
      msghistory.appendChild(el('h3', 'section-title', 'Диалог'));
      const dialog = el('div', 'dialog');
      if (session.fisrtreplica) dialog.appendChild(messageRow('user', session.fisrtreplica));
      msghistory.appendChild(dialog);
      const messages = Array.isArray(session.dialog) ? session.dialog : [];
      const more = el('button', 'load-more-btn');
      more.type = 'button';
      msghistory.appendChild(more);
      let cursor = 0;
      const appendPage = () => {
        const end = Math.min(cursor + DIALOG_PAGE_SIZE, messages.length);
        for (; cursor < end; cursor++) appendDialogMessage(dialog, messages[cursor]);
        more.hidden = cursor >= messages.length;
        more.textContent = more.hidden ? '' : `Показать ещё (${messages.length - cursor} осталось)`;
      };
      more.addEventListener('click', appendPage);
      appendPage();
      if (session.warnings && session.warnings.length) {
        const box = el('div', 'warnings', 'Предупреждения');
        const list = el('ul');
        for (const warning of session.warnings) list.appendChild(el('li', null, warning));
        box.appendChild(list);
        msghistory.appendChild(box);
      }
    }
    async function persistProcessed(parsed, version, inputSize) {
      try {
        await historyReady;
        const saved = await addSessionToHistory(parsed, version === viewVersion, inputSize);
        if (!saved && version === viewVersion) {
          parsed.warnings.push('Сессия отображается, но не сохранена в истории');
          renderSession();
        }
      } catch (error) { console.warn('Ошибка истории:', error); }
    }
    function processInput() {
      const raw = correctioninput.value;
      if (!raw.trim()) { setStatus('Поле пустое', 'error'); return; }
      const inputSize = raw.length;
      correctioninput.value = '';
      let parsed;
      try {
        parsed = kibanaparser(raw);
      } catch (error) {
        correctioninput.value = raw;
        console.error(error);
        setStatus('Ошибка: ' + error.message, 'error');
        return;
      }
      const version = ++viewVersion;
      parsedsession = parsed;
      activeSessionUid = null;
      setStatus('');
      renderSession();
      void persistProcessed(parsed, version, inputSize);
    }
    document.getElementById('refresh-content-btn').addEventListener('click', newSession);
    document.getElementById('load-correction-btn').addEventListener('click', () => correctionfile.click());
    correctionfile.addEventListener('change', () => {
      const file = correctionfile.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { correctioninput.value = String(reader.result); setStatus('Файл загружен', 'ok'); };
      reader.onerror = () => setStatus('Ошибка чтения файла', 'error');
      reader.readAsText(file, 'utf-8');
      correctionfile.value = '';
    });
    correctioninput.addEventListener('paste', () => setStatus('Вставлено; нажмите «Обработать»'));
    document.getElementById('apply-correction-btn').addEventListener('click', processInput);
    renderSessionsList();
    renderSession();
    historyReady = initializeHistory();
  </script>
</body>
</html>
