<body>
<main class="shell">
  <section class="upload" id="upload"><div><h2>Загрузите выгрузку XLSX</h2><p>Файл обрабатывается внутри браузера. Интернет и сервер не используются.</p><p class="dropnote">Перетащите файл в эту область или выберите его вручную</p><div class="fileline" id="fileline"></div><div class="progress" id="progress"><span></span></div></div><div><label class="pick" for="file">Выбрать XLSX</label><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div></section>
  <div class="notice" id="notice"></div>
  <section class="app" id="app">
    <div class="meta"><div><strong id="datasetName"></strong><br><span id="datasetMeta"></span></div><button class="ghost" id="reset">Загрузить другой файл</button></div>
    <nav class="tabs" id="tabs"><button class="tab active" data-tab="overview">Обзор</button><button class="tab" data-tab="firstmiss">Без оценки на 1-м вопросе</button><button class="tab" data-tab="comments">Оценки и комментарии</button><button class="tab" data-tab="points">Тематики по точкам</button><button class="tab" data-tab="planner">Калькулятор</button><button class="tab" data-tab="quality">Качество данных</button></nav>
    <div class="panel active" id="overview"></div><div class="panel" id="firstmiss"></div><div class="panel" id="comments"></div><div class="panel" id="points"></div><div class="panel" id="planner"></div><div class="panel" id="quality"></div>
  </section>
</main>
<script>
const NODE={
 primary:'ASR_CSI VOICE ГМ', noScore:'ASR_CSI VOICE Нет оценки_ГМ', silentRetry:'ASR_CSI VOICE попытка_2 ГМ',
 reasonHigh:['ASR_CSI VOICE _Причина высокой оценки','ASR_CSI VOICE *Причина высокой оценки*ПИЛОТ'],
 reasonLow:['ASR_CSI VOICE _Причина низкой оценки','ASR_CSI VOICE *Причина низкой оценки*ПИЛОТ'],
 reasonGood:['ASR_CSI VOICE _Причина хорошей оценки','ASR_CSI VOICE *Причина хорошей оценки*ПИЛОТ']
};
const ALL_NODES=[NODE.primary,NODE.noScore,NODE.silentRetry,...NODE.reasonHigh,...NODE.reasonLow,...NODE.reasonGood];
const POINT_NAMES={
 [NODE.primary]:'Первый запрос оценки',[NODE.noScore]:'Повтор: ответ без оценки',[NODE.silentRetry]:'Повтор после тишины',
 [NODE.reasonHigh[0]]:'Причина высокой оценки',[NODE.reasonHigh[1]]:'Причина высокой оценки · пилот',
 [NODE.reasonLow[0]]:'Причина низкой оценки',[NODE.reasonLow[1]]:'Причина низкой оценки · пилот',
 [NODE.reasonGood[0]]:'Причина хорошей оценки',[NODE.reasonGood[1]]:'Причина хорошей оценки · пилот'
};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ru-RU').format(n||0), pct=(n,d)=>d?new Intl.NumberFormat('ru-RU',{style:'percent',maximumFractionDigits:1}).format(n/d):'—', num=n=>Number.isFinite(n)?n.toFixed(2).replace('.',','):'—';
const state={data:null,page:{},filters:{},columnFilters:{},point:NODE.primary,scenario:null,firstScore:'all',commentScore:'all',commentView:'comments',pointTopicSelected:[],pointTopicSort:'count'};

function workerMain(){
  const N={primary:'ASR_CSI VOICE ГМ',noScore:'ASR_CSI VOICE Нет оценки_ГМ',silentRetry:'ASR_CSI VOICE попытка_2 ГМ',reasonHigh:['ASR_CSI VOICE _Причина высокой оценки','ASR_CSI VOICE *Причина высокой оценки*ПИЛОТ'],reasonLow:['ASR_CSI VOICE _Причина низкой оценки','ASR_CSI VOICE *Причина низкой оценки*ПИЛОТ'],reasonGood:['ASR_CSI VOICE _Причина хорошей оценки','ASR_CSI VOICE *Причина хорошей оценки*ПИЛОТ']};
  const nodes=[N.primary,N.noScore,N.silentRetry,...N.reasonHigh,...N.reasonLow,...N.reasonGood];
  const td=new TextDecoder();
  const u16=(a,p)=>a[p]|a[p+1]<<8, u32=(a,p)=>(a[p]|a[p+1]<<8|a[p+2]<<16|a[p+3]<<24)>>>0;
  async function unzip(buf){const a=new Uint8Array(buf);let e=a.length-22;while(e>=0&&u32(a,e)!==0x06054b50)e--;if(e<0)throw Error('Не найден каталог ZIP: это может быть не XLSX.');const total=u16(a,e+10),off=u32(a,e+16);let p=off;const out={};for(let i=0;i<total;i++){if(u32(a,p)!==0x02014b50)throw Error('Повреждён ZIP-каталог.');const method=u16(a,p+10),size=u32(a,p+20),nl=u16(a,p+28),xl=u16(a,p+30),cl=u16(a,p+32),lo=u32(a,p+42),name=td.decode(a.slice(p+46,p+46+nl));const lnl=u16(a,lo+26),lxl=u16(a,lo+28),start=lo+30+lnl+lxl,raw=a.slice(start,start+size);if(!name.endsWith('/')){if(method===0)out[name]=raw;else if(method===8){const ds=new DecompressionStream('deflate-raw');out[name]=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(ds)).arrayBuffer())}else throw Error('Неподдерживаемый метод сжатия '+method)}p+=46+nl+xl+cl}return out}
  const decode=s=>s.replace(/&(?:#(\d+)|#x([0-9a-f]+)|amp|lt|gt|quot|apos);/gi,(m,d,h)=>d?String.fromCodePoint(+d):h?String.fromCodePoint(parseInt(h,16)):({"&amp;":'&',"&lt;":'<',"&gt;":'>',"&quot;":'"',"&apos;":"'"}[m.toLowerCase()]||m));
  const textTags=s=>{let r='',m;const re=/<(?:\w+:)?t(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?t>/g;while((m=re.exec(s)))r+=decode(m[1]);return r};
  function shared(xml){if(!xml)return[];const s=td.decode(xml),arr=[];for(const m of s.matchAll(/<(?:\w+:)?si(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?si>/g))arr.push(textTags(m[1]));return arr}
  const colIndex=ref=>{let n=0;for(const c of ref.match(/[A-Z]+/i)?.[0]||'')n=n*26+c.toUpperCase().charCodeAt(0)-64;return n-1};
  function parseSheet(bytes,ss){const xml=td.decode(bytes),rows=[];for(const rm of xml.matchAll(/<(?:\w+:)?row(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?row>/g)){const row=[];for(const cm of rm[1].matchAll(/<(?:\w+:)?c\b([^>]*)>([\s\S]*?)<\/(?:\w+:)?c>|<(?:\w+:)?c\b([^>]*)\/>/g)){const attrs=cm[1]||cm[3]||'',body=cm[2]||'',ref=/\br="([^"]+)"/.exec(attrs)?.[1]||'',t=/\bt="([^"]+)"/.exec(attrs)?.[1]||'',v=/<(?:\w+:)?v(?:\s[^>]*)?>([\s\S]*?)<\/(?:\w+:)?v>/.exec(body)?.[1];let val='';if(t==='inlineStr')val=textTags(body);else if(t==='s')val=ss[Number(v)]??'';else if(t==='str')val=decode(v||'');else if(t==='b')val=v==='1';else if(v!==undefined)val=Number.isFinite(Number(v))?Number(v):decode(v);row[colIndex(ref)]=val}rows.push(row)}return rows}
  const norm=v=>String(v??'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]/g,'');
  const field=v=>{const x=norm(v);if(x==='sessionid'||x.endsWith('sessionidsessionid'))return'session';if(x==='numphrase'||x.endsWith('numphrasenumphrase'))return'num';if(x==='nodeid'||x.endsWith('nodeidnodeid'))return'node';if(x==='value'||x.endsWith('valuevalue'))return'value';if(x==='payloadlabel'||x.endsWith('payloadlabelpayloadlabel'))return'payload';return null};
  function locate(rows){let best=null;for(let r=0;r<Math.min(15,rows.length);r++){const map={};rows[r].forEach((v,c)=>{const f=field(v);if(f&&map[f]===undefined)map[f]=c});const score=Object.keys(map).length;if(!best||score>best.score)best={r,map,score}}if(!best||best.score<4)return null;let start=best.r+1;while(start<rows.length){let n=0;for(const v of rows[start])if(field(v))n++;if(n<3)break;start++}return{...best,start}}
  const scoreOf=p=>{const s=String(p??'').trim().toLowerCase();if(/оценка\s*(?:меньше\s*1|1)(?:\D|$)/i.test(s))return 1;if(/оценка\s*2(?:\D|$)/i.test(s))return 2;if(/оценка\s*3(?:\D|$)/i.test(s))return 3;if(/оценка\s*4(?:\D|$)/i.test(s))return 4;if(/оценка\s*(?:больше\s*5|5)(?:\D|$)/i.test(s))return 5;return null};
  function analyze(rows,loc,sheetName){const m=loc.map,data=[];let missingSession=0,missingNode=0,missingNum=0;for(let i=loc.start;i<rows.length;i++){const a=rows[i];if(!a||!a.some(v=>String(v??'').trim()))continue;const session=String(a[m.session]??'').trim(),node=String(a[m.node]??'').trim(),value=String(a[m.value]??''),payload=String(a[m.payload]??''),rawNum=a[m.num],n=Number(rawNum);if(!session)missingSession++;if(!node)missingNode++;if(rawNum===''||rawNum==null)missingNum++;data.push({session,node,value,payload,num:Number.isFinite(n)?n:null,row:i+1})}
    const sessions=new Map();for(const r of data){if(!r.session)continue;if(!sessions.has(r.session))sessions.set(r.session,[]);sessions.get(r.session).push(r)}
    const details=[],comments=[],pointRows=[],dist=[0,0,0,0,0],pointStats={};let reached=0,firstAnswered=0,recovered=0,finalAnswered=0,conflicts=0,outOfOrder=0,duplicateNums=0;
    for(const [sid,rs] of sessions){const original=rs.map(x=>x.num);rs.sort((a,b)=>(a.num??a.row)-(b.num??b.row)||a.row-b.row);if(original.some((v,i)=>i&&v!=null&&original[i-1]!=null&&v<original[i-1]))outOfOrder++;const seen=new Set();if(rs.some(x=>x.num!=null&&(seen.has(x.num)||!seen.add(x.num))))duplicateNums++;const pi=rs.findIndex(x=>x.node===N.primary);if(pi<0)continue;reached++;const pr=rs[pi],before=pi>0?rs[pi-1]:null,primaryScore=scoreOf(pr.payload);if(primaryScore)firstAnswered++;const scoreNodes=new Set([N.primary,N.noScore,N.silentRetry]);const scored=rs.slice(pi).map((x,i)=>({x,i:pi+i,s:scoreOf(x.payload)})).filter(x=>x.s&&scoreNodes.has(x.x.node));const unique=[...new Set(scored.map(x=>x.s))];if(unique.length>1)conflicts++;const final=scored[0]||null;if(final){finalAnswered++;dist[final.s-1]++;if(!primaryScore)recovered++}const reasonSet=new Set([...N.reasonHigh,...N.reasonLow,...N.reasonGood]);const cmts=rs.slice(pi+1).filter(x=>reasonSet.has(x.node));for(const c of cmts)comments.push({session:sid,score:final?.s||null,node:c.node,value:c.value,payload:c.payload,leadValue:before?.value||'',leadPayload:before?.payload||''});details.push({session:sid,firstValue:pr.value,firstPayload:pr.payload,previousValue:before?.value||'',previousPayload:before?.payload||'',finalScore:final?.s||null,scoreNode:final?.x.node||'',retryOutcome:primaryScore?'Оценка сразу':final?'Оценка на повторе':'Без оценки',commentCount:cmts.length});

function renderPoints(){const d=state.data,stat=d.pointStats[state.point]||{count:0,topics:{}},allTopicNames=Object.keys(stat.topics).sort((a,b)=>a.localeCompare(b,'ru'));$('#points').innerHTML=`<div class="sectionhead"><div><h2>Тематики по точкам CSI</h2><div class="hint">Распределение payload_label и исходные реплики</div></div></div><div class="pointgrid"><div class="pointlist">${ALL_NODES.map(n=>`<button class="pointbtn ${n===state.point?'active':''}" data-point="${esc(n)}"><b>${esc(POINT_NAMES[n])}</b><span class="muted">${fmt(d.pointStats[n]?.count||0)} строк</span></button>`).join('')}</div><div><div class="card"><div class="sectionhead"><div><h3>${esc(POINT_NAMES[state.point])}</h3><div class="hint">Можно выбрать несколько тематик</div></div><div class="controls"><details class="multi" id="pointTopicFilter"><summary>${state.pointTopicSelected.length?`Выбрано: ${state.pointTopicSelected.length}`:'Все тематики'}</summary><div class="multi-menu"><input class="multi-search" id="pointTopicSearch" placeholder="Найти тематику"><div class="multi-options" id="pointTopicOptions"></div><div class="multi-actions"><button id="pointTopicClear">Очистить</button><button id="pointTopicShown">Выбрать показанные</button><button class="apply" id="pointTopicApply">Применить</button></div></div></details><select class="select" id="pointTopicSort"><option value="count" ${state.pointTopicSort==='count'?'selected':''}>По количеству ↓</option><option value="name" ${state.pointTopicSort==='name'?'selected':''}>По названию А–Я</option></select></div></div><div id="topicList"></div></div><div id="pointTable" style="margin-top:14px"></div></div></div>`;document.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>{state.point=b.dataset.point;state.pointTopicSelected=[];state.columnFilters.points={};renderPoints()});const drawTopics=()=>{let topics=Object.entries(stat.topics).filter(([x])=>!state.pointTopicSelected.length||state.pointTopicSelected.includes(x));topics.sort(state.point function renderPlanner(){const d=state.data;state.scenario=state.scenario||d.dist.slice();const s=state.scenario,total=s.reduce((a,b)=>a+b,0),avg=total?s.reduce((a,b,i)=>a+b*(i+1),0)/total:null,cs=total?(s[3]+s[4])/total:null;$('#planner').innerHTML=`<div class="sectionhead"><div><h2>Калькулятор влияния</h2><div class="hint">Текущие значения остаются неизменными; новые вводятся в отдельной колонке сценария</div></div></div><div class="planner"><div class="card"><h3>Текущее и плановое распределение</h3><table class="scenario-table"><thead><tr><th>Оценка</th><th>Сейчас</th><th>План</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td>Оценка ${i+1}</td><td class="current-value">${fmt(d.dist[i])}</td><td><input aria-label="План для оценки ${i+1}" type="number" min="0" step="1" data-score="${i}" value="${x}"></td></tr>`).join('')}</tbody></table><div class="presets"><button data-preset="reset">Вернуть текущие</button><button data-preset="low4">10% оценок 1–3 → 4</button><button data-preset="low5">10% оценок 1–3 → 5</button><button data-preset="half">Половину 3 → 4</button></div></div><div class="scenario"><div><small>Прогноз среднего балла</small><div class="big">${num(avg)} <span class="delta">${avg!=null&&d.weighted!=null?(avg-d.weighted>=0?'+':'')+num(avg-d.weighted):'—'}</span></div></div><div style="margin-top:18px"><small>Прогноз CSAT 4–5</small><div class="big">${pct(s[3]+s[4],total)} <span class="delta">${cs!=null&&d.csat!=null?((cs-d.csat)>=0?'+':'')+((cs-d.csat)*100).toFixed(1).replace('.',',')+' п.п.':'—'}</span></div></div><div style="margin-top:18px"><small>Всего оценок в сценарии</small><div style="font-size:22px;font-weight:800">${fmt(total)}</div></div></div></div>`;document.querySelectorAll('[data-score]').forEach(x=>x.onchange=()=>{state.scenario[+x.dataset.score]=Math.max(0,Math.round(+x.value||0));renderPlanner()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{if(b.dataset.preset==='reset')state.scenario=d.dist.slice();else if(b.dataset.preset==='half'){const n=Math.round(state.scenario[2]/2);state.scenario[2]-=n;state.scenario[3]+=n}else{let moved=0;for(let i=0;i<3;i++){const n=Math.round(state.scenario[i]*.1);state.scenario[i]-=n;moved+=n}state.scenario[b.dataset.preset==='low4'?3:4]+=moved}renderPlanner()})}
function renderQuality(){const q=state.data.quality;$('#quality').innerHTML=`<div class="sectionhead"><div><h2>Контроль качества данных</h2><div class="hint">Проверки, которые могут влиять на интерпретацию результата</div></div></div><div class="quality">${[['Конфликт оценок',q.conflicts,'В одной сессии распознано несколько разных оценок'],['Нарушен порядок',q.outOfOrder,'num_phrase идёт не по возрастанию'],['Дубли № фраз',q.duplicateNums,'Одинаковый num_phrase внутри сессии'],['Без sessionid',q.missingSession,'Строки нельзя привязать к сессии'],['Без node_id',q.missingNode,'Не определена точка сценария'],['Без num_phrase',q.missingNum,'Использован порядок строк файла'],['Вне CSI-точек',q.rowsOutsideCsat,'Контекстные строки сценария']].map(x=>`<div class="qcard"><b>${fmt(x[1])}</b><strong>${esc(x[0])}</strong><div class="muted">${esc(x[2])}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Как считаются показатели</h3><div class="hint" style="margin:6px 0 0">Средний балл = Σ(оценка × количество) / все распознанные оценки. CSAT = оценки 4 и 5 / все распознанные оценки. Первая попытка — только строка «${esc(NODE.primary)}». Итоговая оценка — первая распознанная оценка в CSI-точках после неё. Сессии без первой CSI-точки в знаменатель воронки не входят.</div></div>`}
function downloadCsv(rows,cols,name){const sep=';',q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',txt='\ufeff'+[cols.map(x=>q(x[0])).join(sep),...rows.map(r=>cols.map(x=>q(r[x[1]])).join(sep))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=`csat_${name}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script>
