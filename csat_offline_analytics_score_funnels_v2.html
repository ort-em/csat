}
function compareScores(a,b,labelA,labelB){const ca=[1,2,3,4,5].map(s=>a.filter(x=>x.finalScore===s).length),cb=[1,2,3,4,5].map(s=>b.filter(x=>x.finalScore===s).length),ta=ca.reduce((x,y)=>x+y,0),tb=cb.reduce((x,y)=>x+y,0);return `<div class="legend"><span><i></i>${esc(labelA)}</span><span class="alt"><i></i>${esc(labelB)}</span></div><div class="compare">${ca.map((x,i)=>`<div class="crow"><b>Оценка ${i+1}</b><div class="clines"><div class="cline"><span>${esc(labelA)}</span><div class="track"><div class="fill" style="width:${ta?x/ta*100:0}%"></div></div><span>${pct(x,ta)}</span></div><div class="cline"><span>${esc(labelB)}</span><div class="track"><div class="fill alt" style="width:${tb?cb[i]/tb*100:0}%"></div></div><span>${pct(cb[i],tb)}</span></div></div></div>`).join('')}</div>`}
function topTopics(rows,field,total=rows.length){const m={};for(const r of rows){const v=r[field]||'Пустая тематика';m[v]=(m[v]||0)+1}const entries=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,10);return entries.length?bars(entries,total):'<div class="empty">Нет данных для выбранной оценки</div>'}
function renderFirst(){const d=state.data,other=d.details.filter(x=>x.retryOutcome==='Оценка сразу'),topicRows=d.noFirst.filter(x=>state.firstScore==='all'||(state.firstScore==='null'?x.finalScore==null:x.finalScore==state.firstScore));$('#firstmiss').innerHTML=`<div class="sectionhead"><div><h2>Без оценки на первом вопросе</h2><div class="hint">Сравнение поздних оценок с клиентами, которые оценили сразу</div></div></div><div class="grid2"><div class="card"><h3>Распределение итоговых оценок</h3><div class="hint">Сессии без итоговой оценки не входят в распределение</div>${compareScores(d.noFirst,other,'Не оценили сразу','Оценили сразу')}</div><div class="card"><div class="sectionhead"><div><h3>Топ тематик перед запуском CSI</h3><div class="hint">Последняя распознанная тематика до первого вопроса оценки</div></div><select class="select" id="firstScoreViz"><option value="all">Все итоговые оценки</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${state.firstScore==x?'selected':''}>Оценка ${x}</option>`).join('')}<option value="null" ${state.firstScore==='null'?'selected':''}>Без итоговой оценки</option></select></div>${topTopics(topicRows,'previousPayload')}</div></div><div id="firstTable" style="margin-top:14px"></div>`;$('#firstScoreViz').onchange=e=>{state.firstScore=e.target.value;renderFirst()};const cols=[['Сессия','session'],['Ответ на первый вопрос оценки','firstValue','phrase'],['Распознанная тематика ответа','firstPayload'],['Последняя реплика перед запуском CSI','previousValue','phrase'],['Тематика последней реплики перед CSI','previousPayload'],['Результат попыток','retryOutcome'],['Итоговая оценка','finalScore','',v=>v?`<span class="badge ${v>=4?'good':v<=2?'bad':''}">${v}</span>`:'<span class="muted">нет</span>']];advancedTablePanel('#firstTable',d.noFirst,cols,'first','Детализация с фильтрами по каждому столбцу')}
function renderComments(){const d=state.data,lead=state.commentView==='lead',source=lead?d.scoreLead:d.comments,rows=source.filter(x=>state.commentScore==='all'||x.score==state.commentScore),topicField=lead?'previousPayload':'payload';$('#comments').innerHTML=`<div class="sectionhead"><div><h2>Оценки и комментарии</h2><div class="hint">«Перед CSI» — последняя клиентская реплика непосредственно перед строкой ASR_CSI VOICE ГМ</div></div><div class="controls"><select class="select" id="commentView"><option value="comments" ${!lead?'selected':''}>Комментарии к оценкам</option><option value="lead" ${lead?'selected':''}>Контекст запуска CSI</option></select><select class="select" id="scoreFilter"><option value="all">Все оценки</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${state.commentScore==x?'selected':''}>Оценка ${x}</option>`).join('')}</select></div></div><div class="grid2"><div class="card"><h3>Распределение оценок</h3><div class="hint">По всем сессиям с распознанной итоговой оценкой</div>${bars(d.dist.map((x,i)=>[`Оценка ${i+1}`,x]),d.finalAnswered)}</div><div class="card"><h3>${lead?'Топ тематик перед запуском CSI':'Топ тематик комментариев'}</h3><div class="hint">${state.commentScore==='all'?'Все оценки':`Оценка ${state.commentScore}`}</div>${topTopics(rows,topicField)}</div></div><div id="commentsTable" style="margin-top:14px"></div>`;const cols=lead?[['Сессия','session'],['Оценка','score','',x=>`<span class="badge ${x>=4?'good':x<=2?'bad':''}">${x}</span>`],['Последняя реплика перед запуском CSI','previousValue','phrase'],['Тематика последней реплики перед CSI','previousPayload'],['Точка получения оценки','scoreNode']]:[['Сессия','session'],['Оценка','score','',x=>x?`<span class="badge ${x>=4?'good':x<=2?'bad':''}">${x}</span>`:'—'],['Точка запроса причины','node'],['Комментарий клиента','value','phrase'],['Тематика комментария','payload'],['Последняя реплика перед запуском CSI','leadValue','phrase'],['Тематика последней реплики перед CSI','leadPayload']];advancedTablePanel('#commentsTable',rows,cols,lead?'scorelead':'comments',lead?'Что привело клиента к опросу CSI':'Комментарии клиентов');$('#scoreFilter').onchange=e=>{state.commentScore=e.target.value;renderComments()};$('#commentView').onchange=e=>{state.commentView=e.target.value;renderComments()}}
function renderPoints(){const d=state.data,stat=d.pointStats[state.point]||{count:0,topics:{}},allTopicNames=Object.keys(stat.topics).sort((a,b)=>a.localeCompare(b,'ru'));$('#points').innerHTML=`<div class="sectionhead"><div><h2>Тематики по точкам CSI</h2><div class="hint">Распределение payload_label и исходные реплики</div></div></div><div class="pointgrid"><div class="pointlist">${ALL_NODES.map(n=>`<button class="pointbtn ${n===state.point?'active':''}" data-point="${esc(n)}"><b>${esc(n)}</b><span class="muted">${fmt(d.pointStats[n]?.count||0)} строк</span></button>`).join('')}</div><div><div class="card"><div class="sectionhead"><div><h3>${esc(state.point)}</h3><div class="hint">Можно выбрать несколько тематик</div></div><div class="controls"><details class="multi" id="pointTopicFilter"><summary>${state.pointTopicSelected.length?`Выбрано: ${state.pointTopicSelected.length}`:'Все тематики'}</summary><div class="multi-menu"><input class="multi-search" id="pointTopicSearch" placeholder="Найти тематику"><div class="multi-options" id="pointTopicOptions"></div><div class="multi-actions"><button id="pointTopicClear">Очистить</button><button id="pointTopicShown">Выбрать показанные</button><button class="apply" id="pointTopicApply">Применить</button></div></div></details><select class="select" id="pointTopicSort"><option value="count" ${state.pointTopicSort==='count'?'selected':''}>По количеству ↓</option><option value="name" ${state.pointTopicSort==='name'?'selected':''}>По названию А–Я</option></select></div></div><div id="topicList"></div></div><div id="pointTable" style="margin-top:14px"></div></div></div>`;document.querySelectorAll('[data-point]').forEach(b=>b.onclick=()=>{state.point=b.dataset.point;state.pointTopicSelected=[];state.columnFilters.points={};renderPoints()});const drawTopics=()=>{let topics=Object.entries(stat.topics).filter(([x])=>!state.pointTopicSelected.length||state.pointTopicSelected.includes(x));topics.sort(state.pointTopicSort==='name'?((a,b)=>a[0].localeCompare(b[0],'ru')):((a,b)=>b[1]-a[1]));$('#topicList').innerHTML=topics.length?bars(topics.slice(0,30),stat.count):'<div class="empty">Тематики не найдены</div>'};drawTopics();const details=$('#pointTopicFilter'),search=$('#pointTopicSearch'),box=$('#pointTopicOptions'),draft=new Set(state.pointTopicSelected);let current=[];const drawFilter=(q='')=>{const matched=allTopicNames.filter(v=>v.toLowerCase().includes(q.toLowerCase()));current=matched.slice(0,250);const visible=[...new Set([...draft,...current])];box.innerHTML=visible.map(v=>`<label class="multi-option"><input type="checkbox" data-topicvalue="${esc(v)}" ${draft.has(v)?'checked':''}><span>${esc(v||'(пусто)')}</span></label>`).join('')+(matched.length>250?`<div class="multi-limit">Показаны первые 250 из ${fmt(matched.length)}. Уточните поиск.</div>`:'');box.querySelectorAll('[data-topicvalue]').forEach(x=>x.onchange=()=>x.checked?draft.add(x.dataset.topicvalue):draft.delete(x.dataset.topicvalue))};details.ontoggle=()=>{if(details.open){drawFilter('');setTimeout(()=>search.focus(),0)}};search.oninput=()=>drawFilter(search.value);$('#pointTopicClear').onclick=e=>{e.preventDefault();draft.clear();drawFilter(search.value)};$('#pointTopicShown').onclick=e=>{e.preventDefault();current.forEach(v=>draft.add(v));drawFilter(search.value)};$('#pointTopicApply').onclick=e=>{e.preventDefault();state.pointTopicSelected=[...draft];renderPoints()};$('#pointTopicSort').onchange=e=>{state.pointTopicSort=e.target.value;drawTopics()};const rows=d.pointRows.filter(x=>x.node===state.point),cols=[['Сессия','session'],['№ фразы','num'],['Реплика','value','phrase'],['Тематика','payload'],['Оценка','score','',v=>v||'—']];advancedTablePanel('#pointTable',rows,cols,'points','Фразы в выбранной точке')}
function renderPlanner(){const d=state.data;state.scenario=state.scenario||d.dist.slice();const s=state.scenario,total=s.reduce((a,b)=>a+b,0),avg=total?s.reduce((a,b,i)=>a+b*(i+1),0)/total:null,cs=total?(s[3]+s[4])/total:null;$('#planner').innerHTML=`<div class="sectionhead"><div><h2>Калькулятор влияния</h2><div class="hint">Текущие значения остаются неизменными; новые вводятся в отдельной колонке сценария</div></div></div><div class="planner"><div class="card"><h3>Текущее и плановое распределение</h3><table class="scenario-table"><thead><tr><th>Оценка</th><th>Сейчас</th><th>План</th></tr></thead><tbody>${s.map((x,i)=>`<tr><td>Оценка ${i+1}</td><td class="current-value">${fmt(d.dist[i])}</td><td><input aria-label="План для оценки ${i+1}" type="number" min="0" step="1" data-score="${i}" value="${x}"></td></tr>`).join('')}</tbody></table><div class="presets"><button data-preset="reset">Вернуть текущие</button><button data-preset="low4">10% оценок 1–3 → 4</button><button data-preset="low5">10% оценок 1–3 → 5</button><button data-preset="half">Половину 3 → 4</button></div></div><div class="scenario"><div><small>Прогноз среднего балла</small><div class="big">${num(avg)} <span class="delta">${avg!=null&&d.weighted!=null?(avg-d.weighted>=0?'+':'')+num(avg-d.weighted):'—'}</span></div></div><div style="margin-top:18px"><small>Прогноз CSAT 4–5</small><div class="big">${pct(s[3]+s[4],total)} <span class="delta">${cs!=null&&d.csat!=null?((cs-d.csat)>=0?'+':'')+((cs-d.csat)*100).toFixed(1).replace('.',',')+' п.п.':'—'}</span></div></div><div style="margin-top:18px"><small>Всего оценок в сценарии</small><div style="font-size:22px;font-weight:800">${fmt(total)}</div></div></div></div>`;document.querySelectorAll('[data-score]').forEach(x=>x.onchange=()=>{state.scenario[+x.dataset.score]=Math.max(0,Math.round(+x.value||0));renderPlanner()});document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{if(b.dataset.preset==='reset')state.scenario=d.dist.slice();else if(b.dataset.preset==='half'){const n=Math.round(state.scenario[2]/2);state.scenario[2]-=n;state.scenario[3]+=n}else{let moved=0;for(let i=0;i<3;i++){const n=Math.round(state.scenario[i]*.1);state.scenario[i]-=n;moved+=n}state.scenario[b.dataset.preset==='low4'?3:4]+=moved}renderPlanner()})}
function renderQuality(){const q=state.data.quality;$('#quality').innerHTML=`<div class="sectionhead"><div><h2>Контроль качества данных</h2><div class="hint">Проверки, которые могут влиять на интерпретацию результата</div></div></div><div class="quality">${[['Конфликт оценок',q.conflicts,'В одной сессии распознано несколько разных оценок'],['Нарушен порядок',q.outOfOrder,'num_phrase идёт не по возрастанию'],['Дубли № фраз',q.duplicateNums,'Одинаковый num_phrase внутри сессии'],['Без sessionid',q.missingSession,'Строки нельзя привязать к сессии'],['Без node_id',q.missingNode,'Не определена точка сценария'],['Без num_phrase',q.missingNum,'Использован порядок строк файла'],['Вне CSI-точек',q.rowsOutsideCsat,'Контекстные строки сценария']].map(x=>`<div class="qcard"><b>${fmt(x[1])}</b><strong>${esc(x[0])}</strong><div class="muted">${esc(x[2])}</div></div>`).join('')}</div><div class="card" style="margin-top:14px"><h3>Как считаются показатели</h3><div class="hint" style="margin:6px 0 0">Средний балл = Σ(оценка × количество) / все распознанные оценки. CSAT = оценки 4 и 5 / все распознанные оценки. Первая попытка — только строка «${esc(NODE.primary)}». Итоговая оценка — первая распознанная оценка в CSI-точках после неё. Сессии без первой CSI-точки в знаменатель воронки не входят.</div></div>`}
function downloadCsv(rows,cols,name){const sep=';',q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',txt='\ufeff'+[cols.map(x=>q(x[0])).join(sep),...rows.map(r=>cols.map(x=>q(r[x[1]])).join(sep))].join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download=`csat_${name}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
</script>
